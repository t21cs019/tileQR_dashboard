# ============================================================
# ソース定義 — サーバ1台 = 1ブロック [sources.<key>]
#
#   type   : "manual"   手動でCSVをinboxに置く（疎通困難なサーバ）
#            "onedrive" rcloneでOneDriveから自動pull
#   inbox  : 取り込み待ちフォルダ（プロジェクトルートからの相対 or 絶対）
#   label  : グラフ・表に表示する名前
#   remote : (onedriveのみ) rcloneのリモートパス
#   cpu    : (任意) メタJSONが無いCSV向けの保険ラベル
#            cpus.toml のキー（例: epyc_7702）を指定するとCPU諸元を
#            自動補完する。プリセットに無い文字列ならそのまま
#            model_name 扱い（従来動作）。
# ============================================================

# --- AOBA-B: 外部疎通が難しいので手動運用 ---
# AOBAのNextcloudからCSV(と、あればmeta.json)をDLして
# inbox/manual/aoba_b に置く
[sources.aoba_b]
type  = "manual"
inbox = "inbox/manual/aoba_b"
label = "AOBA-B"
cpu   = "epyc_7702"

